services:
  - type: web
    name: anfatre-art-agent
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22.23.0
      - key: NODE_ENV
        value: production
      - key: APP_HOST
        value: 0.0.0.0
      - key: COOKIE_SECURE
        value: "true"
      - key: CANVA_CLIENT_ID
        value: OC-AZ_x1LKGTx3w
